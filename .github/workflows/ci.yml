---
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

# A newer push to the same branch or PR supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUPPET_GEM_VERSION: '~> 8.0'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # Metadata, Puppet syntax, puppet-lint, RuboCop and task metadata, which
      # is everything `pdk validate` runs. Called through rake so the job does
      # not depend on the PDK package being present on the runner.
      - name: Syntax
        run: bundle exec rake syntax

      - name: Puppet lint
        run: bundle exec rake lint

      - name: Metadata
        run: bundle exec rake metadata_lint

      - name: Ruby style
        run: bundle exec rubocop --format github

  spec:
    name: Spec (Puppet ${{ matrix.puppet }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - puppet: '8'
            ruby: '3.2'
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
        env:
          PUPPET_GEM_VERSION: "~> ${{ matrix.puppet }}.0"

      # `rake spec` rather than a bare `rspec`. bundler-cache installs gems
      # into vendor/bundle inside the repository, spec_prep symlinks the
      # module root into spec/fixtures/modules/certmanager, and rspec's
      # default pattern then collects every gem's own specs through that
      # symlink. The rake task carries the correct pattern and runs
      # spec_prep itself.
      - name: Unit specs
        run: bundle exec rake spec
        env:
          PUPPET_GEM_VERSION: "~> ${{ matrix.puppet }}.0"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install fixtures
        run: bundle exec rake spec_prep

      # spec/unit only, and deliberately. A catalogue compile loads the
      # providers through the fixtures symlink, so the calls land on a copy
      # SimpleCov is not tracking: run with the whole suite the certificate
      # provider reports 29%, run over spec/unit it reports 97%, same tests
      # and same code. The catalogue specs are gated by the Spec job.
      - name: Unit specs with coverage
        run: bundle exec rspec spec/unit
        env:
          COVERAGE: 'yes'
          COVERAGE_MINIMUM: '95'

  reference:
    name: REFERENCE.md is current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # REFERENCE.md is generated. A stale one is worse than none, because it
      # documents parameters that no longer exist.
      - name: Check REFERENCE.md is current
        run: bundle exec rake strings:validate:reference

  docs:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: '**/*.md'
